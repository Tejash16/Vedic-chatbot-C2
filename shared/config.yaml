# C2 benchmark configuration. Written by session C (python -m src.C.make_config). Do not edit by hand.
# tables.<id>.commentary is the exact list of commentary columns, in sheet order.
seed: 7
paths:
  data: ../local/data
  work: ../local/work
  final: ../local/final
  hf_home: ../local/hf-cache
  env: ../local/.env (VEDIC_ANTHROPIC_API_KEY)
text:
  normalization: NFC
  placeholders:
  - N/A
  - NA
  - 'NULL'
  - None
  - undefined
  - nan
  - '-'
  - missing
  - '"Missing"'
  - x
  applied_to: commentary, verse text and pada text
  record_text: commentary columns in sheet order, cleaned, joined by a blank line; no column names
chunking:
  tokenizer: BAAI/bge-m3
  target_tokens: 300
  variants_C6:
  - 150
  - 600
  rule: break at a column boundary first, then at sentence ends (danda, double danda, ? ! and full stop + space, line break); small whole columns of the same language share a chunk; a chunk smaller than
    0.3 x target takes the next column's first sentences; a last chunk smaller than 0.3 x target joins the one before if both fit in 1.3 x target; a sentence longer than target is cut at a space
  header: '''<Veda> <ref> | <work name from the file name>'' (no column names); embed header + newline + text unless the setup removes the header'
  max_length_passages: 512
  max_length_600_variant: 1024
corpus:
  languages:
  - hi
  - sa
  - en
  target_chunks: 10000
  selection: verses ordered by (rank within their Veda / verses in that Veda), rank = sha256('7|'+verse_id); take every hi/sa/en record of each verse until 10,000 chunks; data-only and deterministic
  full: every hi/sa/en chunk (session C runs it once as corpus_size 'full')
verse_group: NFC unaccented verse text with accent marks, spaces, punctuation and digits removed; verses with the same key form a group; verse-level scoring counts any verse of the gold verse's group
questions:
  model: claude-haiku-5-5
  groups:
    hi: Hindi in Devanagari
    en: English
    hi_roman: Hindi typed in Roman letters, phone style
    sa_quote: Hindi or English question quoting a few Sanskrit words of the verse
  per_group: 90
  gold_chunk_langs_per_group:
    hi: 36
    en: 32
    sa: 22
  styles:
  - direct
  - reworded
  - broad
  real: group 'real' may be added later; always reported separately
candidates:
  keyword:
    C1a: bm25s, own tokenizer (src.common.text.words)
    C1b: OpenSearch BM25, Hindi analyzer for hi/sa, English analyzer for en, plus unstemmed field
  embedding:
    C2a: BAAI/bge-m3 dense, sparse, dense+sparse
    C2b: Qwen/Qwen3-Embedding-0.6B dense, alone and fused with C1a
  fusion:
    method: reciprocal rank fusion
    k: 60
  question_forms:
    C4: as typed; claude-haiku-5-5 rewrite to Devanagari and to English; each fused with the original
  rerankers:
    C5:
    - BAAI/bge-reranker-v2-m3
    - Qwen/Qwen3-Reranker-0.6B
    - claude-haiku-5-5 picks best 8
    keep: 8
    input: shared/candidates_top50.jsonl
  chunk_variants:
    C6:
    - 150 tokens
    - 600 tokens
    - 300 tokens without header
    embedding: bge-m3 dense+sparse
    gold: any chunk of the gold record overlapping the gold character span
gpu:
  precision: fp16
  lock: python bus/bus.py gpu acquire|release
metrics:
  k:
  - 5
  - 10
  - 20
  mrr_at: 10
  ndcg_at: 10
  levels:
  - chunk
  - verse
  verse_level: a hit is any chunk whose verse is in the gold verse's group
  chunk_level: 'a hit is the gold chunk only (C6: overlap rule above)'
  latency: p50 and p95 per question for the stage, on that machine, in ms
  cost: paid US dollars per 1,000 questions
results_schema:
- session
- stage
- run_id
- setup
- corpus_size
- question_group
- level
- recall_5
- recall_10
- recall_20
- mrr_10
- ndcg_10
- p50_ms
- p95_ms
- paid_usd_per_1000
- machine
- notes
results_optional:
- recall_8
- mrr_8
- ndcg_8
